name: smart_finance_app
description: "Smart Finance - Loan & Personal Finance Manager with AI, OCR and Multi-Stage EMI Reminders"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management & Routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Financial Charts & Visualization
  fl_chart: ^0.68.0

  # Local Persistence & Storage
  sqflite: ^2.3.3+1
  path_provider: ^2.1.3
  path: ^1.9.0
  shared_preferences: ^2.2.3

  # Formatting & Date Handling
  intl: ^0.19.0
  uuid: ^4.4.0

  # Local Notifications & Scheduling for EMI Reminders (T-7 to Overdue)
  flutter_local_notifications: ^17.2.1+2
  timezone: ^0.9.4

  # Networking & AI Integration
  http: ^1.2.1

  # File / Document Picker & File Processing
  file_picker: ^8.0.5
  another_telephony: ^0.4.1
  permission_handler: 11.3.1
  crypto: ^3.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
